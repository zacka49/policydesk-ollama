[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policydesk-ollama"
version = "0.1.0"
description = "A grounded local support assistant with retrieval, deterministic policy rules, and Ollama generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
mcp = [
    "mcp>=1.0,<2",
]

[project.scripts]
policydesk = "policydesk.cli:main"
policydesk-mcp = "policydesk.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/policydesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
