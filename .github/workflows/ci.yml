name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --extra mcp
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: uv run policydesk evaluate --offline --output outputs/ci-evaluation.json
      - name: Compile Bicep templates
        run: |
          az bicep build --file infra/foundation.bicep --stdout > /dev/null
          az bicep build --file infra/app.bicep --stdout > /dev/null
      - run: docker build -t policydesk-ci .
